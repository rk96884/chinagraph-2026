name: Quality checks

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.0

      - name: Verify required files
        shell: bash
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/theme.js
          test -d pages
          echo "Required project files found."

      - name: Check for unresolved merge markers
        shell: bash
        run: |
          if grep -RInE '^(<<<<<<< .+|=======|>>>>>>> .+)$' . \
            --exclude-dir=.git \
            --exclude-dir=node_modules; then
            echo "Unresolved merge markers found."
            exit 1
          fi

          echo "No unresolved merge markers found." 